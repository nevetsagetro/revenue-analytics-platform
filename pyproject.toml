[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-analytics-platform"
version = "0.1.0"
description = "Reference implementation of an applied revenue analytics platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Revenue Analytics Platform contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
revenue-analytics = "revenue_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revenue_analytics = ["sql/*.sql", "sql/analysis/*.sql"]

[tool.pytest.ini_options]
addopts = "-q --cov=revenue_analytics --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
